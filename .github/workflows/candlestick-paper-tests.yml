name: Candlestick paper smoke tests
on:
  push:
    branches:
      - feature/hammer-morning-star-paper-20261122
  pull_request:
    paths:
      - candlestick_paper.py
      - test_candlestick_paper.py
      - .github/workflows/candlestick-paper-tests.yml
jobs:
  paper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile candlestick_paper.py test_candlestick_paper.py
      - run: python -m pip install requests websocket-client
      - run: python -m unittest -v test_candlestick_paper

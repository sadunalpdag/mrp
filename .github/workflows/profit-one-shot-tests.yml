name: Profit one-shot safety tests
on:
  push:
    branches:
      - feature/one-shot-profit-close-v2-20261124
  pull_request:
    paths:
      - profit_lock_live.py
      - crash_night.py
      - crash_manual_tp.py
      - test_profit_one_shot_v2.py
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m py_compile profit_lock_live.py crash_night.py crash_manual_tp.py test_profit_one_shot_v2.py
      - run: python -m unittest -v test_profit_one_shot_v2

name: CB2 legacy order protection regression
on:
  push:
    branches:
      - feature/cb2-isolated-real-limit-20261117
      - master
    paths:
      - cb2_real_order_gateway.py
      - cb2_real_executor.py
      - ema.py
      - test_cb2_real_order_gateway.py
      - test_cb2_real_executor.py
      - .github/workflows/cb2-real-order-preflight-tests.yml
  pull_request:
    paths:
      - cb2_real_order_gateway.py
      - cb2_real_executor.py
      - ema.py
      - test_cb2_real_order_gateway.py
      - test_cb2_real_executor.py
      - .github/workflows/cb2-real-order-preflight-tests.yml
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_cb2_real_order_gateway test_cb2_real_executor

name: BTC range paper observer checks
on:
  pull_request:
    paths:
      - "btc_range_paper.py"
      - "btc_coinbeacon_ohlcv.py"
      - "btc_coinbeacon_levels.py"
      - "test_btc_coinbeacon_levels.py"
      - "btc_hourly_direction.py"
      - "test_btc_range_paper.py"
      - "test_btc_coinbeacon_ohlcv.py"
      - "test_btc_gemini_http.py"
      - "test_btc_gemini_access_probe.py"
      - "btc_gemini_access_probe.py"
      - ".github/workflows/btc-range-paper-tests.yml"
  push:
    branches: [master]
    paths:
      - "btc_range_paper.py"
      - "btc_coinbeacon_ohlcv.py"
      - "btc_coinbeacon_levels.py"
      - "test_btc_coinbeacon_levels.py"
      - "btc_hourly_direction.py"
      - "test_btc_range_paper.py"
      - "test_btc_coinbeacon_ohlcv.py"
      - "test_btc_gemini_http.py"
      - "test_btc_gemini_access_probe.py"
      - "btc_gemini_access_probe.py"
      - ".github/workflows/btc-range-paper-tests.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m py_compile btc_range_paper.py btc_coinbeacon_levels.py btc_coinbeacon_ohlcv.py btc_hourly_direction.py btc_gemini_access_probe.py
      - run: python -m unittest -v test_btc_range_paper test_btc_coinbeacon_levels test_btc_coinbeacon_ohlcv test_btc_gemini_http test_btc_gemini_access_probe
